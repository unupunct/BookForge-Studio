[project]
name = "bookforge-studio"
version = "0.3.0"
description = "Local-first desktop book creation and publishing application"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.6",
  "python-docx>=1.1",
  "reportlab>=4.0",
  "Pillow>=10.0",
  "PyMuPDF>=1.24",
  "markdown-it-py>=3.0",
  "pyphen>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
